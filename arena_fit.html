<script>
function p(v) { return Math.round(v * 1000) / 1000; }
function tileCss(GW, GH) {
  var w = p(100 / GW), h = p(100 / GH);
  return "#arena div{width:" + w + "%;height:" + h + "%}.c,.d{width:" + p(w * 2) + "%!important;height:" + p(h * 2) + "%!important}";
}
function build(seed, GW, GH) {
  var s = seed % 4294967296, out = [], H2 = GW / 2;
  function r() { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }
  function ri(a, b) { return a + Math.floor(r() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(r() * a.length)]; }
  function t(c, x, y) { out.push('<div class="' + c + '" style="left:' + p(x * 100 / GW) + '%;top:' + p(y * 100 / GH) + '%"></div>'); }
  function row(c, x, y, n) { for (var i = 0; i < n; i++) t(c, x + i, y); }
  function mrow(c, x, y, n) { row(c, x, y, n); row(c === "a" ? "b" : c, GW - x - n, y, n); }
  function mcrate(c, x, y) { t(c, x, y); t(c, GW - x - 2, y); }
  var i, k, x, y, w, yy;
  row("f", 0, 0, GW); row("f", 0, GH - 1, GW);
  for (y = 1; y < GH - 1; y++) { t("f", 0, y); t("f", GW - 1, y); }
  mrow("a", 3, GH - 2, 8);
  for (y = GH - 7; y >= 7; y -= 5) {
    x = 3 + ri(0, 2);
    while (x < H2 - 5) {
      w = Math.min(pick([6, 8, 10, 12, 14]), H2 - 3 - x);
      if (w < 5) break;
      yy = y + ri(-1, 1);
      mrow("a", x, yy, w);
      if (r() < 0.45) mcrate(pick(["c", "c", "d"]), x + ri(1, Math.max(1, w - 3)), yy - 2);
      x += w + ri(4, 8);
    }
  }
  for (i = 0; ; i++) {
    yy = GH - 5 - i * 5;
    if (yy < 9) break;
    row("m", i % 2 === 0 ? H2 - 9 : H2 + 4, yy, 5);
  }
  row("m", H2 - 5, 5, 10);
  for (k = 0; k < 4; k++) {
    x = 14 + k * 7 + ri(-1, 1);
    if (x < H2 - 5) mcrate(pick(["c", "d"]), x, GH - 3);
  }
  return out.join("");
}

var GW = Math.max(40, 2 * Math.round(window.innerWidth / 80));
var GH = Math.max(22, Math.round(window.innerHeight / 40));
document.getElementById("tilecss").textContent = tileCss(GW, GH);
document.getElementById("arena").innerHTML = build(Math.floor(Math.random() * 1000000000), GW, GH);
</script>
